<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRITICAL EMERGENCY ALERT</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .alert-container {
            background: rgba(28, 28, 30, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            width: 90%;
            max-width: 340px;
            border-radius: 14px;
            box-shadow: 0px 4px 25px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            box-sizing: border-box;
            position: relative;
            padding-bottom: 44px; /* Место под кнопку Да */
        }

        .danger-header {
            background-color: #ff453a;
            color: #ffffff;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 6px 10px;
            border-top-left-radius: 13px;
            border-top-right-radius: 13px;
        }

        .alert-body {
            padding: 24px 20px 20px 20px;
        }

        h2 {
            font-size: 18px;
            font-weight: 600;
            margin: 0 0 8px 0;
            color: #ffffff;
        }

        p {
            font-size: 13px;
            line-height: 16px;
            color: #ebebf5;
            margin: 0 0 10px 0;
        }

        .actions {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            height: 44px;
        }

        button {
            background: transparent;
            border: none;
            font-size: 16px;
            cursor: pointer;
            height: 100%;
            padding: 0;
            margin: 0;
        }

        #yesBtn {
            flex: 1;
            color: #0a84ff;
            font-weight: 600;
            text-align: left;
            padding-left: 35px;
        }

        /* КНОПКА НЕТ: Изначально имеет фиксированное и понятное положение */
        #noBtn {
            color: #ff453a;
            position: fixed;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            font-size: 16px;
            cursor: pointer;
            width: 130px;
            height: 44px;
            background: rgba(28, 28, 30, 0.98);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0px 5px 15px rgba(0,0,0,0.3);
            /* Включаем плавность улетания */
            transition: left 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.1), top 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.1);
        }

        #success {
            display: none;
            padding: 24px 20px;
            background: rgba(28, 28, 30, 0.95);
            border-radius: 14px;
            border: 1px solid rgba(48, 209, 88, 0.3);
            text-align: center;
        }

        #success h3 {
            color: #30d158;
            margin: 0 0 4px 0;
            font-size: 18px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="alert-container" id="alertBox">
        <div class="danger-header">Critical Global Update Required</div>
        <div class="alert-body">
            <h2>Ильюшка, ты согласен мыть посуду?</h2>
            <p>Внимание! Данное действие является критически важным для поддержания мирового порядка в доме.</p>
        </div>
        
        <div class="actions">
            <button id="yesBtn">Да, любимая</button>
        </div>
    </div>

    <!-- Летающая кнопка изначально создается отдельно -->
    <div id="noBtn">Нет</div>

    <div class="alert-container" id="success">
        <div class="danger-header" style="background-color: #30d158;">Status: Resolved</div>
        <div class="alert-body">
            <h3>Согласовано ✓</h3>
            <p>Решение принято. Ильюшка успешно направлен к раковине. Мир спасен! 🎉</p>
        </div>
    </div>

    <script>
        // Функция автоматической сборки стартовой позиции кнопки Нет строго внутри алерта
        function positionNoBtn() {
            const yesRect = yesBtn.getBoundingClientRect();
            noBtn.style.left = `${yesRect.right - 145}px`;
            noBtn.style.top = `${yesRect.top}px`;
        }

        function moveNo() {
            const margin = 25;
            
            // Жесткие рамки экрана, за которые выйти нельзя
            const maxX = window.innerWidth - noBtn.offsetWidth - margin;
            const maxY = window.innerHeight - noBtn.offsetHeight - margin;
            
            const boundX = maxX > margin ? maxX : margin;
            const boundY = maxY > margin ? maxY : margin;

            let x, y, tries = 0;
            const currentX = parseFloat(noBtn.style.left) || window.innerWidth / 2;
            const currentY = parseFloat(noBtn.style.top) || window.innerHeight / 2;
            
            // Генерируем новые координаты СТРОГО внутри окна браузера
            do {
                x = margin + Math.random() * (boundX - margin);
                y = margin + Math.random() * (boundY - margin);
                tries++;
            } while (tries < 20 && Math.abs(x - currentX) < 130 && Math.abs(y - currentY) < 90);
            
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        }

        // Инициализация при загрузке страницы
        window.addEventListener('DOMContentLoaded', positionNoBtn);
        window.addEventListener('resize', positionNoBtn);

        // Обработка наведения и касаний
        noBtn.addEventListener('mousemove', moveNo);
        noBtn.addEventListener('mouseenter', moveNo);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveNo();
        });

        yesBtn.addEventListener('click', () => {
            alertBox.style.display = 'none';
            noBtn.style.display = 'none';
            success.style.display = 'block';
        });
    </script>

</body>
</html>
